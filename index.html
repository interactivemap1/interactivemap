<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد بلدية سلفيت الرقمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: only light;
    --olive-900:#b9b7da;
    --olive-700:#eee9d8;
    --olive-500:#eee9d8be;
    --stone-100:#eee9d8;
    --stone-50:#f6f3e8;
    --gold-500:#c08b03ee;
    --ink:#26281f;
    --paper:#fffdf7;
    --bubble-bot:#fffdf7c4;
    --bubble-user:#eee9d8d3;
    --bubble-user-text:#0a0a0a;
    --border:#ded6b8;
    --shell-bg:#000000;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0;
    min-height:100%;
    background:var(--shell-bg);
    color:var(--ink);
    font-family:"Tajawal",system-ui,sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    display:flex;
    justify-content:center;
  }
  .app{
    width:100%;
    max-width:560px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--paper);
    box-shadow:0 0 40px rgba(0,0,0,.08);
  }
  header{
    padding:18px 20px calc(16px + env(safe-area-inset-top,0px));
    padding-top:calc(18px + env(safe-area-inset-top,0px));
    background:var(--olive-700);
    color:#000000;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;
    top:0;
    z-index:5;
  }
  .logo{
    width:44px;height:44px;border-radius:50%;
    background:#fffdf7;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:20px;color:#2f2408;
    flex-shrink:0;
    overflow:hidden;
    border:#0a3b00;
    box-shadow:0 1px 4px rgba(0,0,0,.18);
  }
  .logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  header h1{font-size:16px;margin:0;font-weight:700;}
  header p{margin:2px 0 0;font-size:12px;color:#0a3b00;font-weight:400;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:#0a3b00;display:inline-block;margin-inline-end:5px;}

  .chips{
    display:flex;gap:8px;padding:12px 16px;overflow-x:auto;
    border-bottom:1px solid var(--border);
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--stone-100);
    color:var(--ink);
    font-family:inherit;font-size:13px;font-weight:500;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip:active{background:var(--olive-500);color:#dfb324;}

  .messages{
    flex:1;
    padding:18px 16px;
    display:flex;flex-direction:column;gap:12px;
    overflow-y:auto;
  }
  .msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.7;}
  .msg.bot{
    align-self:flex-start;
    background:var(--bubble-bot);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--bubble-user);
    color:var(--bubble-user-text);
    border-bottom-right-radius:4px;
    font-size:14.5px;
  }
  .msg.bot h3{margin:0 0 6px;font-size:15px;color:#dfb324;}
  .msg .tag{
    display:inline-block;font-size:11px;color:var(--gold-500);
    border:1px solid var(--gold-500);border-radius:10px;padding:1px 8px;margin-bottom:8px;
  }
  .msg .field-label{font-weight:700;color:#dfb324;margin:10px 0 4px;font-size:13px;}
  .msg ul{margin:2px 0 0;padding-inline-start:18px;}
  .msg li{margin-bottom:5px;}
  .msg .note{margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);font-size:8.5px;color:#000000;}
  .svc-list{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .svc-btn{
    text-align:right;
    background:var(--stone-100);
    border:1px solid var(--border);
    color:var(--ink);
    border-radius:10px;
    padding:8px 12px;
    font-family:inherit;font-size:13.5px;
    cursor:pointer;
  }
  .svc-btn:active{background:var(--olive-500);color:#dfb324;}

  .typing{align-self:flex-start;display:flex;gap:4px;padding:12px 16px;}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--olive-500);opacity:.5;animation:blink 1.1s infinite;}
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .msg.typing-cursor::after{content:"";display:inline-block;width:2px;height:1em;margin-inline-start:3px;background:var(--ink);vertical-align:text-bottom;animation:caret .8s steps(1) infinite;}
  @keyframes caret{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.typing span{animation:none;opacity:.7;}}

  form{
    display:flex;gap:8px;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));
    border-top:1px solid var(--border);
    background:var(--paper);
  }
  input[type=text]{
    flex:1;
    border:1px solid var(--border);
    border-radius:22px;
    padding:11px 16px;
    font-family:inherit;font-size:14.5px;
    background:var(--stone-100);
    color:var(--ink);
    outline:none;
  }
  input[type=text]:focus{border-color:var(--olive-500);}
  button.send{
    width:44px;height:44px;border-radius:50%;
    border:none;background:var(--olive-700);color:#000000;
    font-size:16px;cursor:pointer;flex-shrink:0;
  }
  button.send:focus-visible, .chip:focus-visible, .svc-btn:focus-visible{outline:2px solid var(--gold-500);outline-offset:2px;}
  .note-bar{
    font-size:10px;color:#000000;text-align:center;
    padding:6px 16px 10px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <img src="https://raw.githubusercontent.com/munsalfeet/Salfeet.trails/main/logoS.jpg" alt="شعار بلدية سلفيت">
    </div>
    <div>
      <h1>مساعد بلدية سلفيت</h1>
      <p><span class="status-dot"></span>بلدية سلفيت</p>
    </div>
  </header>

  <div class="chips" id="chips"></div>

  <div class="messages" id="messages"></div>

  <form id="chatForm">
    <input type="text" id="userInput" placeholder="اكتب اسم الخدمة" autocomplete="off">
    <button type="submit" class="send" aria-label="إرسال">➤</button>
  </form>
  <div class="note-bar">بلدية سلفيت </div>
</div>

{"id":8,"department":"الهندسة","name":"تعديل موقع بناء مرخص","time_required":"3 أيام","documents":["صورة هوية مالك الرخصة.","مخطط موقع جديد للبناء المرخص."],"legal_basis":["نظام الأبنية للهيئات المحلية رقم 5 لعام 2011م"],"steps":["يتم تقديم طلب تعديل الموقع للرخصة في مركز خدمة الجمهور.","يتم تحويل الطلب ومخططات الموقع المعدل لدائرة الهندسة / م. التنظيم لدراسة الطلب والتزامه بالارتدادات القانونية لمنطقة التنظيم ثم موافقة مدير الدائرة على ذلك.","يتم عرض الطلب على اللجنة المحلية لأخذ قرار موافقة على تعديل موقع البناء المرخص.","يتم تحويل الطلب للدائرة المالية / الصندوق لدفع رسوم تعديل الموقع.","يتم إعادة الطلب لدائرة الهندسة / م. التنظيم لتثبيت التعديل وأرشفته في ملف الرخصة الصادرة سابقاً وتسليم المواطن نسخة من تعديل الموقع."]},
{"id":9,"department":"الهندسة","name":"طلب إذن حفر","time_required":"2 يوم","documents":["صورة عن الرخصة.","3 نسخ من نموذج إذن الحفر محدد عليه الغاية من الحفر والمنطقة."],"legal_basis":["بروتوكول التعاون مع نقابة المهندسين","الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب لدائرة الهندسة للموافقة على الحفر في الموقع.","يتم تحويل الطلب للدوائر المعنية (دائرة المياه، صرف صحي، دائرة الكهرباء) للموافقة على الحفر.","أخذ موافقة الاتصالات الفلسطينية.","أخذ موافقة شرطة المرور.","يتم تحويل الطلب للدائرة المالية لوضع تأمين بقيمة 1000 شيقل.","يتم مصادقة رئيس البلدية على الطلب.","يتم إعادة الطلب لدائرة الهندسة لأرشفته وتسليم نسخة للمواطن."]},
{"id":10,"department":"الهندسة","name":"توحيد أراضي","time_required":"14 يوم","documents":["صورة عن البطاقة الشخصية للمالك.","براءة ذمة سارية المفعول للمالك.","إثبات ملكية (سند تسجيل أو وكالة دورية مع بيان كيفية انتقال الملكية والمساحة).","موافقة جميع الشركاء بطلب خطي.","4 نسخ من مخططات موقع وترسيم سارية المفعول.","4 نسخ من مخططات توحيد (تشمل خطوط الكنتور) مصدقة من مساح مرخص.","جداول إحداثيات مسجل عليها رقم الحوض والقطع ومصدقة من مساح مرخص.","تسليم حدود قطعة الأرض لمساح البلدية."],"legal_basis":["نظام الأبنية للهيئات المحلية رقم 5 لعام 2011م"],"steps":["يتم تقديم طلب في مركز خدمة الجمهور مكتمل (مساحة، طلب توحيد موقع من جميع الورثة، فتح ملف).","يتم تحويل الطلب لدائرة الهندسة / شعبة المساحة للكشف وعمل الدراسات اللازمة.","يتم عرض الطلب على اللجنة المعنية ومن ثم يحول للمجلس البلدي.","يتم مصادقة الرئيس عليه.","يتم أرشفة الملف ثم إغلاقه."]},
{"id":11,"department":"الهندسة","name":"طلب إذن إشغال","time_required":"5 أيام","documents":["صورة عن الرخصة.","طلب إصدار إذن إشغال لإيصال خدمة (ساري المفعول لمدة 6 شهور).","موقع من المهندس المشرف على البناء ونقابة المهندسين."],"legal_basis":["نظام الأبنية للهيئات المحلية رقم 5 لعام 2011م","بروتوكول التعاون مع نقابة المهندسين"],"steps":["يتم تقديم الطلب لإشغال مبنى وإيصال خدمة في مركز خدمة الجمهور.","يتم تحويل الطلب لدائرة الهندسة للكشف على البناء من قبل مراقب الأبنية وأخذ القياسات على الواقع.","يتم مقارنة الواقع مع البناء المرخص من قبل مهندس التنظيم وحساب رسوم أي زيادات أو مخالفات.","يتم تحويل الطلب للدوائر المعنية (المياه والكهرباء والصرف الصحي والصحة والبيئة) لأخذ الموافقة على الطلب.","يتم تحويل الطلب للدائرة المالية / الصندوق لدفع أي غرامات في حال وجودها.","يتم إعادة الطلب لمركز خدمة الجمهور لإصدار الموافقة على إذن الإشغال."]},
{"id":12,"department":"الهندسة","name":"إفراز أرض","time_required":"14 يوم","documents":["صورة عن البطاقة الشخصية للمالك.","براءة ذمة سارية المفعول للمالك.","إثبات ملكية (سند تسجيل أو وكالة دورية مع بيان كيفية انتقال الملكية والمساحة).","موافقة جميع الشركاء بطلب خطي.","4 نسخ من مخططات موقع وترسيم سارية المفعول.","4 نسخ من مخططات إفراز مصدقة من مساح مرخص ومربوط إحداثيات ومحوسبة مع نسخة عليها خطوط الكنتور.","جداول إحداثيات مسجل عليها رقم الحوض والقطع ومصدقة من مساح مرخص.","تسليم حدود قطع الأراضي لمساح البلدية."],"legal_basis":["نظام الأبنية للهيئات المحلية رقم 5 لعام 2011م"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور مع صورة مخطط المساحة المصدق وكتاب خطي بالإفراز للقطعة موقع من طالب الإفراز.","يتم تحويل الطلب لدائرة الهندسة / شعبة المساحة لدراسة الطلب والرد عليه إما بالرفض أو الإيجاب وفي حال الموافقة سيتم احتساب الرسوم وتحويل الطلب مرة أخرى لخدمة الجمهور لفتح ملف ودفع الرسوم.","يتم تحويل الطلب مرة أخرى لدائرة الهندسة / شعبة المساحة للشرح وتحويل الملف للجنة المحلية.","مصادقة رئيس البلدية بعد القرار.","يتم تحويل الطلب لدائرة الهندسة لاعتماد الملف والأرشفة.","يتم إعادة الطلب لمركز خدمة الجمهور لإغلاقه."]},
{"id":13,"department":"الهندسة","name":"شراء فضلة طريق","time_required":"30 يوم","documents":["صورة عن البطاقة الشخصية.","إثبات ملكية للأرض المجاورة للفضلة المعنية.","مخطط مساحة مصدق من مساح مرخص (ترخيص ساري المفعول) ومختوم بختم أصيل (لا تقبل الصورة) وموضح عليه مساحة القطعة الخاصة بالمستدعي ومساحة الفضلة المراد شرائها، وذلك في حال الموافقة على شراء الفضلة."],"legal_basis":["قانون تنظيم المدن والقرى لعام 1966","قرارات المجلس البلدي"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور مع إرفاق الوثائق المطلوبة.","يتم تحويل الطلب لدائرة الهندسة / شعبة المساحة للتدقيق.","يتم تحويل الطلب لمدير الدائرة الهندسية للتعليق وعرضه على اللجنة المحلية.","يتم تقدير ثمن الفضلة من قبل لجنة تخمين.","يتم رفع قرار المجلس والمعاملة لأخذ مصادقة وزير الحكم المحلي.","يتم تحويل الطلب مرة أخرى للمجلس البلدي لاعتماد التخمين.","يتم تحويل الطلب للدائرة المالية لدفع الرسوم.","يتم تحويل الطلب لدائرة الهندسة / شعبة المساحة لتسليم الأرض للمواطن وللحفظ والأرشفة.","يتم إعادة الطلب لمركز خدمة الجمهور لإغلاقه."]},
{"id":14,"department":"الهندسة","name":"طلب تقدير مسافة","time_required":"3 أيام","documents":["صورة عن البطاقة الشخصية.","إثبات موقع السكن بوثيقة.","إثبات موقع العمل بوثيقة."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور (تحديد موقع المنزل وموقع العمل).","يتم تحويل الطلب لدائرة الهندسة / شعبة المساحة لتقدير المسافة.","يتم إعادة الطلب لمركز خدمة الجمهور لطباعة شهادة بالمسافة وتسليمها للمواطن بعد دفع رسوم الشهادة."]},
{"id":15,"department":"الهندسة","name":"طلب كشف أراضي ومعلومات عن قطعة أرض","time_required":"3 أيام","documents":["صورة عن البطاقة الشخصية.","إثبات ملكية وتحديد الموقع.","في حال طلب معلومات تنظيمية عن قطعة أرض يجب إحضار مساحة مصدقة."],"legal_basis":["قانون تنظيم المدن والقرى لعام 1966م","الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور مع إرفاق الوثائق المطلوبة.","يتم تحويل الطلب لدائرة الهندسة / شعبة المساحة لرصد المعلومات.","يتم تحويل الطلب للدائرة المالية لدفع الرسوم.","يتم إعادة الطلب لمركز خدمة الجمهور لطباعة شهادة بالمعلومات عن قطعة الأرض وتسليمها للمواطن."]},
{"id":16,"department":"الهندسة","name":"شكاوى المواطنين على المقاولين أثناء تنفيذ المشاريع","time_required":"4 أيام","documents":["الطلب.","وثائق تدعم الطلب."],"legal_basis":["وثائق العطاء"],"steps":["يتم تقديم الطلب أو الشكوى في مركز خدمة الجمهور.","يتم تحويل الشكوى إلى الدائرة الهندسية / قسم المشاريع للكشف الميداني والتعليق ومتابعتها وحفظها في ملف مشروع.","يتم تحويل الطلب إلى مركز خدمة الجمهور لإصدار رد على الطلب وتسليمه للمواطن وإغلاق الطلب."]},
{"id":17,"department":"الهندسة","name":"شهادة إنجاز مشروع","time_required":"4 أيام","documents":["العقد الموقع.","محضر الاستلام الابتدائي.","صورة عن الهوية الشخصية."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة الهندسية / قسم المشاريع للتعليق.","يتم تحويل الطلب لمدير الدائرة الهندسية للتعليق.","يتم تحويل الطلب لمركز خدمة الجمهور لإصدار الشهادة وتسليمها للمواطن بعد دفع رسوم الشهادة."]},
{"id":18,"department":"الهندسة","name":"شهادة براءة ذمة خاصة بالمشاريع","time_required":"7 أيام","documents":["الطلب.","محضر الاستلام الابتدائي.","العقد الموقع."],"legal_basis":["وثائق العطاء"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدوائر المعنية المياه والصرف الصحي والكهرباء والدائرة الهندسية / قسم المشاريع للتعليق.","يتم تحويل الطلب إلى الدائرة المالية / أمين الصندوق لاستيفاء المستحقات المطلوبة من المقاول.","يتم تحويل الطلب مع مرفقاته إلى قسم المشاريع من أجل إغلاق الملف.","يتم تحويل الطلب إلى مركز خدمة الجمهور لإصدار الشهادة وتسليمها للمقاول بعد دفع رسوم الشهادة."]},
{"id":19,"department":"الهندسة","name":"طلب استلام مشروع","time_required":"15 يوم","documents":["العقد الموقع.","الطلب."],"legal_basis":["وثائق العطاء"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة الهندسية / قسم المشاريع للتعليق. (في حال تم إنهاء كافة الأعمال المطلوبة من المقاول يتم عرض الطلب على رئيس البلدية لتشكيل لجنة استلام لاستلام المشروع).","يقوم قسم المشاريع واللجنة باستلام المشروع ووضع الملاحظات المطلوبة من المقاول ويقوم قسم المشاريع بمتابعة ملاحظات الاستلام الابتدائي.","يتم تحويل الملف إلى لجنة المشاريع لاتخاذ توصية.","يتم عرض التوصية على المجلس البلدي للمصادقة عليها.","يتم تحويل قرار المجلس البلدي على المشاريع للمتابعة."]},
{"id":20,"department":"الهندسة","name":"استلام كفالة بنكية","time_required":"3 أيام","documents":["الطلب.","العقد الموقع."],"legal_basis":["وثائق العطاء"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة الهندسية / لجنة المشاريع للتعليق.","يتم تحويل الطلب إلى قسم المشتريات لتسليم الكفالة للمقاول.","يتم تحويل الطلب ومرفق معه الكفالة وتوقيع المستلم عليها للمشاريع للحفظ في الملف.","يتم تحويل الطلب ومرفقاته إلى مركز خدمة الجمهور لإغلاق الطلب."]},
{"id":21,"department":"الهندسة","name":"طلب باطون أكتاف","time_required":"10 أيام","documents":["الطلب.","وثائق تدعم الطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة الهندسية / قسم المشاريع للكشف الميداني وعمل تقرير كشف موقع وكلفة تقديرية.","يتم تحويل الطلب لمدير الدائرة الهندسية للتعليق.","يتم تحويل الطلب إلى الدائرة المالية لعرضه على اللجنة المالية.","يتم تحويله الطلب إلى قسم المشاريع لعرضه على لجنة المشاريع لاتخاذ توصية.","يتم تحويل توصية لجنة المشاريع على الطلب للمجلس البلدي للمصادقة عليها.","يتم تحويل القرار إلى قسم المشاريع لمتابعته حسب قرار المجلس البلدي.","يتم تحويل الطلب بعد وضع قرار المجلس البلدي عليه لمركز خدمة الجمهور لتسليم الرد للمواطن وإغلاق الطلب."]},

{"id":30,"department":"المياه والكهرباء","name":"اشتراك مياه","time_required":"7 أيام","documents":["صورة عن البطاقة الشخصية للمستفيد.","براءة ذمة مالية سارية المفعول.","إثبات ملكية (سند تسجيل أو وكالة قانونية) أو عقد إيجار.","رخصة بناء أو دفع رسوم الترخيص للعقار المعني.","في حال لم يكن مقدم الطلب هو المالك / المستأجر، فعليه إحضار ما يثبت قانونياً توكيله بتقديم الطلب، يرفق الإثبات القانوني وصورة هوية مقدم الطلب بالطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم طلب اشتراك مياه في مركز خدمة الجمهور.","يتم تحويل الطلب للدائرة المالية لعمل براءة ذمة.","يتم تحويل الطلب لدائرة الهندسة للكشف والتدقيق.","يتم تحويل الطلب إلى قسم المياه للتدقيق وفحص إمكانية الشبك للعقار.","يتم تحويل الطلب إلى قسم الصرف الصحي للتدقيق والموافقة وعمل الملاحظات.","يتم تحويل الطلب إلى الدائرة المالية لاستيفاء الرسوم وتوقيع المواطن على اتفاقية اشتراك المياه.","يتم تحويل الطلب إلى قسم المياه لإدخال رقم الاشتراك ورقم العداد والشاصي على نظام الفوترة لتتم عملية قراءة العداد.","القيام بأرشفة وحفظ الملف في ملفات معاملات المياه."]},
{"id":31,"department":"المياه والكهرباء","name":"فصل اشتراك مياه","time_required":"3 أيام","documents":["صورة البطاقة الشخصية لمالك اشتراك مياه.","براءة ذمة سارية المفعول لمالك اشتراك المياه.","مقدم الطلب يجب أن يكون مالك اشتراك المياه، وفي حال لم يكن مقدم الطلب هو مالك للاشتراك فعلى مقدم الطلب إحضار ما يثبت قانونياً توكيله بتقديم الطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم طلب إيقاف اشتراك في خدمة المياه في مركز خدمة الجمهور.","يتم تحويل الطلب للدائرة المالية لعمل براءة ذمة.","يتم تحويل الطلب إلى قسم المياه للتدقيق في الفواتير والمستحقات المالية على الاشتراك.","يتم تحويل الطلب إلى الدائرة المالية لاستيفاء الرسوم المطلوبة وتعبئة النموذج الخاص بفصل اشتراك مياه.","يتم فصل العداد في الموقع.","القيام بأرشفة وحفظ الملف في ملفات معاملات المياه."]},
{"id":32,"department":"المياه والكهرباء","name":"تسليك خط ورفع الضرر - المياه والكهرباء","time_required":"1 يوم","documents":["صورة البطاقة الشخصية.","تقديم الطلب."],"legal_basis":["نظام المجاري للهيئات المحلية.","نظام التعرفة لبلدية سلفيت والمصادق عليه."],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور خطياً أو شفوياً بوجود تسكير خط وفيضان مياه عادمة في الشارع أو الموقع.","يتم الكشف فوراً على موقع التسكيرية وتقدير الاحتياجات اللازمة والمعدات المطلوبة لفتح الخط من قبل شعبة الصرف الصحي.","يتم تجهيز ما يلزم على الفور من معدات وأيدي عاملة ومواد وغير ذلك والتوجه مباشرة إلى موقع التسكيرية وتنفيذ فتح التسكيرية وتنظيف المناهل في موقع التسكيرية ويعتبر هذا العمل له أولوية قصوى سواءً كان أثناء الدوام الرسمي أو في الأوقات الأخرى (إجازات، أعياد رسمية وخلافه)."]},
{"id":33,"department":"المياه والكهرباء","name":"إعادة وصل خدمة المياه","time_required":"5 أيام","documents":["صورة عن البطاقة الشخصية لمالك اشتراك مياه.","براءة ذمة سارية المفعول لمالك اشتراك مياه.","مقدم الطلب يجب أن يكون مالك اشتراك المياه، وفي حال لم يكن كذلك فعليه إحضار ما يثبت توكيله قانونياً بتقديم الطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم طلب إعادة وصل اشتراك مياه في مركز خدمة الجمهور.","يتم تحويل الطلب للدائرة المالية لعمل براءة ذمة.","يتم تحويل الطلب لدائرة الهندسة للكشف والتدقيق.","يتم تحويل الطلب إلى قسم المياه للتدقيق.","يتم تحويل الطلب إلى الدائرة المالية لاستيفاء الرسوم المطلوبة وتعبئة النموذج الخاص بإعادة وصل اشتراك مياه.","يتم تحويل الطلب لقسم المياه لتفعيل الاشتراك وتغيير الحالة من منتهي إلى موصول في نظام الفوترة لتتم عملية قراءة العداد.","القيام بأرشفة وحفظ الملف في ملفات معاملات المياه."]},
{"id":34,"department":"المياه والكهرباء","name":"نقل ملكية اشتراك مياه","time_required":"5 أيام","documents":["صورة البطاقة الشخصية للمالك الجديد (المشتري) والمالك الأصيل (البائع).","براءة ذمة سارية المفعول للمالك الحالي / الأصيل للاشتراك (البائع).","توقيع اتفاقية نقل ملكية اشتراك المياه من قبل الطرفين (البائع والمشتري) أو إحضار ما يثبت تنازل المالك الأصيل، أو تعهد عدلي من قبل المشتري.","أي مبالغ استهلاك تستحق خلال عملية النقل (قبل صدور آخر فاتورة) يتم ترحيلها على المشترك الجديد.","مقدم الطلب يجب أن يكون المعني بتملك الاشتراك، وإلا فعلى مقدم الطلب إحضار ما يثبت قانونياً توكيله بتقديم الطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم طلب نقل ملكية اشتراك مياه في مركز خدمة الجمهور.","يتم تحويل الطلب للدائرة المالية لعمل براءة ذمة.","يتم تحويل الطلب لدائرة الهندسة للكشف والتدقيق.","يتم تحويل الطلب إلى قسم المياه للتدقيق في الفواتير والمستحقات المالية على الاشتراك.","يتم تحويل الطلب إلى الدائرة المالية لاستيفاء الرسوم المطلوبة وتعبئة النموذج الخاص بنقل ملكية اشتراك مياه.","يتم تحويل الطلب لقسم المياه لتحويل رقم الاشتراك من المالك القديم إلى المالك الجديد وإدخاله على نظام الفوترة لتتم عملية قراءة العداد باسم المالك الجديد.","القيام بأرشفة وحفظ الملف للمشترك الجديد في ملفات معاملات المياه."]},
{"id":35,"department":"المياه والكهرباء","name":"نقل اشتراك مياه لموقع آخر","time_required":"5 أيام","documents":["صورة عن البطاقة الشخصية لمالك اشتراك مياه.","إثبات ملكية (سند تسجيل أو وكالة قانونية) أو عقد إيجار للموقع الجديد مع وجود رخصة بناء أو دفع رسوم الترخيص.","براءة ذمة سارية المفعول لصاحب خط المياه (على القطعة القديمة والجديدة).","وجود رخصة بناء أو دفع رسوم بدل ترخيص.","مقدم الطلب يجب أن يكون مالك اشتراك المياه، وفي حال لم يكن مقدم الطلب هو مالك الاشتراك، فعلى مقدم الطلب إحضار ما يثبت توكيله قانونياً بتقديم الطلب، يرفق الإثبات القانوني وصورة هوية مقدم الطلب بالطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم طلب نقل موقع عداد مياه من موقع إلى آخر في مركز خدمة الجمهور.","يتم تحويل الطلب للدائرة المالية لعمل براءة ذمة.","يتم تحويل الطلب لدائرة الهندسة للكشف والتدقيق.","يتم تحويل الطلب إلى قسم المياه للتدقيق وفحص إمكانية النقل.","يتم تحويل الطلب إلى قسم الصرف الصحي للتدقيق.","يتم تحويل الطلب إلى الدائرة المالية لاستيفاء الرسوم المطلوبة وتعبئة النموذج الخاص بنقل موقع عداد مياه.","يتم تحويل الطلب لقسم المياه لتغيير موقع العداد على أرض الواقع وتغييره على نظام الفوترة لتتم عملية قراءة العداد.","القيام بأرشفة وحفظ الملف في ملفات معاملات المياه."]},
{"id":36,"department":"المياه والكهرباء","name":"اشتراك صرف صحي في حالة توفر الخدمة","time_required":"3 أيام","documents":["صورة البطاقة الشخصية.","براءة ذمة سارية المفعول.","إثبات ملكية العقار.","تعهد عدلي في حال أن العقار ممنوع الشبك."],"legal_basis":["نظام المجاري للهيئات المحلية.","نظام التعرفة لبلدية سلفيت والمصادق عليه."],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى قسم الهندسة لوضع معلومات العقار الخاصة برسوم الصرف الصحي مثل مجموع مساحات البناء ومساحة الأرض ومساحة الطابق الأرضي وكذلك رقم القطعة والحوض واسم الموقع.","يتم تحويل الطلب إلى شعبة الصرف الصحي ليتم احتساب الرسوم المطلوبة وتثبيتها على الطلب.","يتم الكشف على العقار على الواقع ويتم توضيح آلية الشبك للمواطن أو الفني وتوضيح متطلبات الشبك الفنية.","يتم تحويل الطلب إلى الدائرة المالية لدفع الرسوم المستحقة لصندوق البلدية أو دفع جزء منها وتقسط الباقي بما يتناسب مع قرارات المجلس البلدي بهذا الخصوص.","يتم متابعة الشبك وفحص الأعمال قبل تشغيل الخدمة للمواطن للاطمئنان على تنفيذ الأعمال المطلوبة بشكل سليم وآمن."]},
{"id":37,"department":"المياه والكهرباء","name":"اشتراك صرف صحي في حالة عدم توفر الخدمة","time_required":"3 أيام","documents":["صورة البطاقة الشخصية.","براءة ذمة سارية المفعول.","إثبات ملكية العقار.","تعهد عدلي في حال أن العقار ممنوع الشبك.","تأمين مالي مرتجع."],"legal_basis":["نظام المجاري للهيئات المحلية.","نظام التعرفة لبلدية سلفيت والمصادق عليه."],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى قسم الهندسة لوضع معلومات العقار الخاصة برسوم الصرف الصحي.","يتم تحويل الطلب إلى شعبة الصرف الصحي لاحتساب الرسوم المطلوبة عن العقار.","يتم الكشف على الواقع وعمل تقرير مبسط للتكاليف التقديرية لإيصال الخدمة للملكية الخاصة للمواطن.","يتم توصيل الخدمة لأرض المواطن من خلال التعاون ما بين المواطن والبلدية وتقاسم التكاليف المطلوبة بما يتناسب مع قرارات المجلس البلدي بهذا الخصوص.","يتم شبك العقار بإشراف البلدية لضمان تنفيذ الشبك بشكل سليم وآمن.","في حال عدم توافق البلدية مع المواطن أو المواطنين أصحاب الطلب يتم تأجيل إيصال الخدمة لحين توفير الإمكانيات أو الحصول على مشروع يدرج فيه موقع العقار لإيصال الخدمة إلى الملكية الخاصة للمواطن أو المواطنين طالبي الخدمة."]},
{"id":38,"department":"المياه والكهرباء","name":"اشتراك كهرباء 1 فاز (منزلي، تجاري)","time_required":"6 أيام","documents":["صورة عن البطاقة الشخصية للمستفيد.","براءة ذمة مالية سارية المفعول.","إثبات ملكية (سند تسجيل أو وكالة قانونية) أو عقد إيجار.","رخصة بناء أو دفع رسوم الترخيص للعقار المعني.","توقيع المشترك على معاملة اشتراك الكهرباء.","في حال لم يكن مقدم الطلب هو المالك / المستأجر، فعليه إحضار ما يثبت قانونياً توكيله بتقديم الطلب، يرفق الإثبات القانوني وصورة هوية مقدم الطلب بالطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب للخدمة في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة المالية لبيان كشف الذمم المالية والمستحقات والديون على المشترك.","يتم تحويل الطلب إلى الدائرة الهندسية لفحص ملف الترخيص والكشف الميداني.","يتم تحويل الطلب إلى دائرة الكهرباء لبيان الإمكانية الفنية للشبك على الخدمة.","يتم إرجاع الطلب إلى الدائرة المالية لدفع رسوم الطلب ورسوم الاشتراك وثمن العداد من قبل المواطن.","يتم تحويل المعاملة إلى قسم الكهرباء لربط الاشتراك بعد برمجة العداد وأرشفة المعاملة."]},

{"id":42,"department":"المياه والكهرباء","name":"نقل ملكية اشتراك كهرباء (1 فاز أو 3 فاز)","time_required":"4 أيام","documents":["صورة عن البطاقة الشخصية لمالك اشتراك الكهرباء والشخص المراد نقل الاشتراك له.","إحضار إثبات ملكية أو تنازل من المالك القديم للاشتراك للشخص الجديد مع التواقيع.","براءة ذمة سارية المفعول لمالك اشتراك الكهرباء.","توقيع صاحب الاشتراك المراد نقل ملكيته وتوقيع الشخص المراد نقل الملكية له على المعاملة.","في حال لم يكن مقدم الطلب هو المالك، فعليه إحضار ما يثبت قانونياً توكيله بتقديم الطلب، يرفق الإثبات القانوني وصورة هوية مقدم الطلب بالطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب للخدمة في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة المالية لبيان كشف الذمم المالية والمستحقات والديون على المشترك.","يتم تحويل الطلب إلى الدائرة الهندسية لفحص ملف الترخيص والكشف الميداني.","يتم إرجاع الطلب إلى الدائرة المالية لدفع الرسوم من قبل المواطن.","يتم تحويل المعاملة إلى قسم الكهرباء لتغيير المعلومات وقيد المشترك على النظام.","يتم أرشفة المعاملة ووضع طلب النقل على المعاملة الأصلية."]},
{"id":43,"department":"المياه والكهرباء","name":"نقل موقع اشتراك كهرباء (عداد) (1 فاز أو 3 فاز)","time_required":"4 أيام","documents":["صورة عن البطاقة الشخصية لمالك اشتراك الكهرباء.","إحضار إثبات ملكية للموقع الجديد المراد نقل العداد إليه أو موافقة صاحب العقار المراد نقل العداد إليه.","براءة ذمة سارية المفعول لمالك اشتراك الكهرباء.","توقيع صاحب الاشتراك على المعاملة.","في حال لم يكن مقدم الطلب هو المالك، فعليه إحضار ما يثبت قانونياً توكيله بتقديم الطلب، يرفق الإثبات القانوني وصورة هوية مقدم الطلب بالطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب للخدمة في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة المالية لبيان كشف الذمم المالية والمستحقات والديون على المشترك.","يتم تحويل الطلب إلى الدائرة الهندسية لفحص ملف الترخيص والكشف الميداني.","يتم تحويل الطلب إلى الدائرة الكهربائية لبيان الإمكانية الفنية للشبك في الموقع الجديد المراد نقل الاشتراك له.","يتم إعادة الطلب إلى الدائرة المالية لدفع الرسوم من قبل المواطن.","يتم تحويل المعاملة إلى قسم الكهرباء لفصل الاشتراك من الموقع القديم ونقله للموقع الجديد بعد إحضار المواد اللازمة للشبك.","يتم تغيير موقع الاشتراك على النظام وأرشفة المعاملة."]},
{"id":44,"department":"المياه والكهرباء","name":"فصل خدمة الكهرباء (فصل العداد) مؤقتة أو دائمة","time_required":"4 أيام","documents":["صورة عن البطاقة الشخصية لمالك اشتراك الكهرباء.","إحضار إثبات ملكية للاشتراك.","براءة ذمة سارية المفعول لمالك اشتراك الكهرباء.","توقيع صاحب الاشتراك على المعاملة.","في حال لم يكن مقدم الطلب هو المالك، فعليه إحضار ما يثبت قانونياً توكيله بتقديم الطلب، يرفق الإثبات القانوني وصورة هوية مقدم الطلب بالطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تعبئة نموذج الطلب للخدمة من قبل موظفة استقبال الطلبات في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة المالية لبيان كشف الذمم المالية والمستحقات وتسوية الديون على المشترك.","يتم تحويل الطلب إلى الدائرة الكهربائية لفصل الاشتراك عن النظام وفصل عداد الكهرباء في الموقع.","يتم إعادة الطلب إلى الدائرة المالية لدفع الرسوم من قبل المواطن.","يتم وقف الاشتراك على النظام وأرشفة المعاملة."]},
{"id":45,"department":"المياه والكهرباء","name":"إعادة وصل خدمة الكهرباء","time_required":"4 أيام","documents":["صورة عن البطاقة الشخصية لمالك اشتراك الكهرباء.","إحضار إثبات ملكية للاشتراك.","براءة ذمة سارية المفعول لمالك اشتراك الكهرباء.","توقيع صاحب الاشتراك على المعاملة.","في حال لم يكن مقدم الطلب هو المالك، فعليه إحضار ما يثبت قانونياً توكيله بتقديم الطلب، يرفق الإثبات القانوني وصورة هوية مقدم الطلب بالطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب للخدمة في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة المالية لبيان كشف الذمم المالية والمستحقات والديون على المشترك.","يتم تحويل الطلب إلى الدائرة الهندسية لفحص ملف الترخيص والكشف الميداني.","يتم تحويل الطلب إلى الدائرة الكهربائية لبيان الإمكانية الفنية للشبك في الموقع.","يتم إرجاع الطلب إلى الدائرة المالية لدفع الرسوم من قبل المواطن.","يتم تحويل المعاملة إلى قسم الكهرباء لشبك الاشتراك من جديد بعد إحضار المواد اللازمة للشبك.","يتم إعادة الاشتراك على النظام وأرشفة المعاملة."]},
{"id":46,"department":"المياه والكهرباء","name":"فحص أو تغيير عداد كهرباء","time_required":"3 أيام","documents":["صورة عن البطاقة الشخصية لمقدم الطلب.","إحضار إثبات ملكية للاشتراك.","فحص العداد مجاني في حال وجود خلل حقيقي.","يتم تغيير العداد مجاناً على الكفالة قبل انتهائها إذا كان الخلل في العداد نفسه وليس بسبب سوء استعمال أو تركيب.","يتم دفع ثمن عداد جديد من قبل المشترك من أجل تركيبه عندما يكون سبب عطل العداد من توصيل خاطئ أو دخول ماء عليه أو ما شابهه أدى إلى احتراقه."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب للخدمة في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة الكهربائية لفحص عداد الكهرباء وبيان تلف أو صلاح العداد مع إمكانية تغييره وسبب تلفه.","يتم تحويل الطلب إلى المالية من أجل دفع ثمن عداد كهرباء جديد من قبل المواطن إذا ثبت تلف العداد بسبب إهمال المواطن.","يتم إعادة المعاملة إلى مركز خدمة الجمهور لإبلاغ المواطن بالنتيجة."]},
{"id":47,"department":"المياه والكهرباء","name":"نقل أو تغيير أو إضافة عامود كهرباء","time_required":"من أسبوع إلى أسبوعين","documents":["صورة عن البطاقة الشخصية لمقدم الطلب.","إثبات حاجة الموقع الماسة لنقل أو تغيير أو إضافة عامود كهرباء."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب للخدمة في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة الكهربائية لبيان الإمكانية الفنية لتركيب العامود في الموقع المطلوب وبيان أن الموقع خاص أو عام أو بيان تلف العامود أو إعاقته للمواطنين.","يتم تحويل الطلب إلى المالية من أجل دفع ثمن عامود كهرباء جديد من قبل المواطن إذا ثبت تلف العامود بسببه أو لدخلة خاصة لمنزله.","يتم تغيير عامود الكهرباء أو نقله مجاناً من قبل البلدية إذا كان تالفاً أو شكل عائقاً حقيقياً أو ضرراً على المواطنين.","يتم إعادة المعاملة إلى مركز خدمة الجمهور مع الرد بإيجابية أو سلبية الطلب ويتم أرشفة الطلب."]},
{"id":48,"department":"المياه والكهرباء","name":"نقل أو تغيير أو إضافة خط كهرباء رئيسي","time_required":"4 أيام","documents":["صورة عن البطاقة الشخصية لمقدم الطلب.","إثبات حاجة الموقع الماسة لنقل أو تغيير أو إضافة خط كهرباء رئيسي."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب للخدمة في مركز خدمة الجمهور.","يتم تحويل الطلب إلى الدائرة الكهربائية للكشف على الموقع لبيان الإمكانية الفنية لتركيب خط كهرباء في الموقع المطلوب وبيان أن خط الكهرباء خاص أو عام أو بيان تلف الخطوط الكهربائية الرئيسية أو إعاقتها للمواطنين أو تشكيلها خطراً على المواطنين.","يتم تحويل الطلب إلى المالية من أجل دفع ثمن كابل كهرباء جديد من قبل المواطن إذا ثبت تلف الكابل بسببه أو لدخلة خاصة لمنزله.","يتم نقل أو تغيير أو إصلاح الخطوط الكهربائية مباشرة عند تشكيلها خطراً على المواطنين.","يتم إعادة المعاملة إلى مركز خدمة الجمهور وإبلاغ المواطن بالنتيجة ويتم أرشفة الطلب."]},
{"id":49,"department":"المياه والكهرباء","name":"تمديد وصلة كهرباء لحفل زفاف (خط على العامود)","time_required":"1 يوم","documents":["صورة عن البطاقة الشخصية لمقدم الطلب.","كتاب من البلدية للشرطة بعدم الممانعة من إقامة حفلة العرس في الموقع المذكور من أجل متابعة وموافقة الشرطة على عدم إشغال الطريق.","تحديد مكان وزمان عمل حفلة العرس المذكور من أجل وضع وصلة الأعراس قبل الموعد المحدد في المكان المناسب.","الوصلة واللوحة الكهربائية من البلدية وهي ملك البلدية يتم وضعها وإزالتها عند انتهاء الحفلة."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب للخدمة في مركز خدمة الجمهور.","يتم دفع الرسوم المطلوبة وإحضار الكتب المطلوبة والتوقيع على التعهد المطلوب.","دفع تأمين للبلدية وهو مسترد بعد الحفلة بعد الكشف وتنظيف الموقع من الأوساخ.","يحول الطلب إلى قسم الكهرباء من أجل وضع الوصلة الكهربائية بعد تحديد مكان وزمان حفلة العرس.","يتم أرشفة الطلب."]},
{"id":50,"department":"الصحة والبيئة","name":"طلب رخصة حرف وصناعات","time_required":"12 يوم","documents":["صورة عن البطاقة الشخصية لصاحب الحرفة (مالك رخصة الحرف).","إثبات ملكية (سند تسجيل أو وكالة قانونية) أو عقد إيجار.","إحضار موافقات الجهات المعنية في حال تطلب الأمر ذلك.","في حال لم يكن مقدم الطلب هو صاحب الأمر (مالك الرخصة)، فعليه إحضار ما يثبت قانونياً توكيله بتقديم الطلب.","رخصة الحرف والصناعات سارية المفعول حتى 12/31 من العام الذي صدرت فيه.","إحضار عقد أو شهادة إحدى الجهات التالية إن لزم (عقد شراكة أو كتاب مراقب الشركات أو حسن سلوك)."],"legal_basis":["نظام الهيئات المحلية لرخص الحرف والصناعات.","قانون الصحة العامة."],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى دائرة الصحة والبيئة للكشف واحتساب الرسوم.","يتم تحويل الطلب إلى الدائرة المالية لدفع الرسوم أو أي مستحقات على مقدم الطلب.","يتم إرجاع الطلب إلى دائرة الصحة والبيئة لإصدار الرخصة.","ترسل الرخصة إلى مديرية صحة سلفيت للتصديق على الرخصة.","يتم إعادة الطلب لمركز خدمة الجمهور وتسليم الرخصة للمواطن."]},
{"id":51,"department":"الصحة والبيئة","name":"تجديد رخصة حرف وصناعات","time_required":"7 أيام","documents":["صورة عن رخصة الحرف والصناعات.","إحضار موافقات الجهات المعنية في حال تطلب الأمر ذلك."],"legal_basis":["نظام الهيئات المحلية لرخص الحرف والصناعات.","قانون الصحة العامة"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى دائرة الصحة والبيئة للكشف واحتساب الرسوم.","يتم تحويل الطلب إلى الدائرة المالية لدفع الرسوم أو أي مستحقات على مقدم الطلب.","يتم إعادة الطلب إلى دائرة الصحة والبيئة لإصدار الرخصة.","ترسل الرخصة إلى مديرية صحة سلفيت للتصديق على الرخصة.","يتم إرجاع الطلب لمركز خدمة الجمهور وتسليم الرخصة للمواطن."]},
{"id":52,"department":"الصحة والبيئة","name":"طلب بدل فاقد رخصة حرف وصناعات","time_required":"3 أيام","documents":["صورة عن البطاقة الشخصية لصاحب الرخصة."],"legal_basis":["نظام الهيئات المحلية لرخص الحرف والصناعات.","قانون الصحة العامة"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى دائرة الصحة والبيئة لإصدار رخصة جديدة بدل فاقد.","ترسل الرخصة إلى مديرية صحة سلفيت للتصديق على الرخصة.","يتم إعادة الطلب لمركز خدمة الجمهور وتسليم الرخصة للمواطن بعد دفع رسوم إصدار رخصة بدل فاقد."]},
{"id":53,"department":"الصحة والبيئة","name":"إغلاق ملف حرف وصناعات","time_required":"3 أيام","documents":["صورة عن البطاقة الشخصية لصاحب الرخصة.","براءة ذمة سارية المفعول لصاحب الرخصة."],"legal_basis":["نظام فتح وإغلاق المحلات التجارية."],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى دائرة الصحة والبيئة للكشف واحتساب الرسوم إن وجدت.","يتم تحويل الطلب إلى الدائرة المالية لدفع الرسوم أو أي مستحقات على مقدم الطلب.","يتم إعادة الطلب إلى دائرة الصحة والبيئة لإغلاق ملف رخصة الحرف والصناعات.","يتم تحويل الطلب لمركز خدمة الجمهور وطباعة شهادة بإغلاق الحرفة وتسليمها للمواطن بعد دفع رسوم الشهادة."]},
{"id":54,"department":"الصحة والبيئة","name":"تغيير اسم حرفة","time_required":"3 أيام","documents":["صورة عن البطاقة الشخصية لصاحب الرخصة.","في حال لم يكن مقدم الطلب هو صاحب الأمر (مالك الأمر)، فعليه إحضار ما يثبت قانونياً توكيله بتقديم الطلب."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت"],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى دائرة الصحة والبيئة للكشف واحتساب الرسوم للحرفة الجديدة.","يتم تحويل الطلب إلى الدائرة المالية لدفع الرسوم أو أي مستحقات على مقدم الطلب.","يتم إعادة الطلب إلى دائرة الصحة والبيئة لتغيير اسم الحرفة في الرخصة وإصدار الرخصة الجديدة.","يتم إعادة الطلب لمركز خدمة الجمهور وتسليم الرخصة للمواطن."]},
{"id":55,"department":"الصحة والبيئة","name":"طلب شراكة في رخصة حرف","time_required":"3 أيام","documents":["إحضار عقد مكتوب بالشراكة أو كتاب مراقب الشركات.","صور عن البطاقات الشخصية للشركاء."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت","نظام الهيئات المحلية لرخص الحرف والصناعات."],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى دائرة الصحة والبيئة للكشف واحتساب الرسوم إن وجدت.","يتم تحويل الطلب إلى الدائرة المالية لدفع الرسوم أو أي مستحقات على مقدم الطلب.","يتم إعادة الطلب إلى دائرة الصحة والبيئة لإدخال أسماء الشركاء في الرخصة وإصدار الرخصة الجديدة.","يتم إعادة الطلب لمركز خدمة الجمهور وتسليم الرخصة للمواطن."]},
{"id":56,"department":"الصحة والبيئة","name":"التنازل عن رخصة حرف وصناعات","time_required":"3 أيام","documents":["صورة عن رخصة الحرف والصناعات.","صورة عن البطاقة الشخصية لصاحب الرخصة الأصيل.","صورة عن البطاقة الشخصية للشخص المراد التنازل له عن الرخصة."],"legal_basis":["الأنظمة والإجراءات المتبعة في بلدية سلفيت","نظام الهيئات المحلية لرخص الحرف والصناعات."],"steps":["يتم تقديم طلب التنازل من قبل صاحب الحرفة في مركز خدمة الجمهور.","يتم تحويل الطلب إلى دائرة الصحة والبيئة للكشف واحتساب الرسوم.","يتم تحويل الطلب إلى الدائرة المالية لدفع الرسوم أو أي مستحقات على مقدم الطلب.","يتم تحويل الطلب إلى دائرة الصحة والبيئة لتغيير اسم صاحب الحرفة وإصدار الرخصة.","يتم إرسال الرخصة إلى مديرية صحة سلفيت للتصديق على الرخصة.","يتم إعادة الطلب لمركز خدمة الجمهور وتسليم الرخصة للمواطن."]},
{"id":57,"department":"الصحة والبيئة","name":"طلب تركيب لافتات إعلانية","time_required":"12 يوم","documents":["صورة عن البطاقة الشخصية لصاحب الشركة الإعلانية أو اللافتة.","تعبئة اتفاقية استئجار مكان لافتة للشركات الإعلانية.","رسم كروكي لموقع اللافتة وموافقة الدوائر المعنية.","تأمين المسؤولية المدنية من قبل الشركات الإعلانية."],"legal_basis":["نظام اللافتات والإعلانات."],"steps":["يتم تقديم الطلب في مركز خدمة الجمهور.","يتم تحويل الطلب إلى دائرة الصحة والبيئة للكشف ووضع الملاحظات.","يتم تحويل الطلب إلى دوائر البلدية المختصة (مياه وصرف صحي وكهرباء وهندسة) للموافقة.","يتم تحويل الطلب إلى دائرة الصحة والبيئة لاحتساب الرسوم للافتة الإعلانية.","يتم تحويل الطلب إلى الدائرة المالية لدفع الرسوم أو أي مستحقات على مقدم الطلب.","يتم تحويل الطلب للدائرة الهندسية لتحديد الموقع المناسب للافتة الإعلانية ورسم كروكي له.","يتم تحويل الطلب إلى دائرة الصحة والبيئة لإصدار رخصة اللافتة.","يتم إعادة الطلب لمركز خدمة الجمهور وتسليم الرخصة للمواطن."]},

const STOPWORDS = new Set(["طلب","خدمة","او","أو","من","الى","إلى","في","على","عن","مع","ال","هل","كيف","اريد","أريد","بدي","ابي","أبي","لل","بال","و"]);

function normalize(s){
  if(!s) return "";
  return s
    .replace(/[\u064B-\u065F\u0670\u0640]/g,"")
    .replace(/[إأآا]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ؤ/g,"و")
    .replace(/ئ/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/[^\u0600-\u06FF0-9a-zA-Z\s]/g," ")
    .replace(/\s+/g," ")
    .trim()
    .toLowerCase();
}

const DEPARTMENTS = [...new Set(SERVICES.map(s => s.department))];

SERVICES.forEach(s => {
  s._normName = normalize(s.name);
  s._normAll = normalize([s.name, (s.documents||[]).join(" "), (s.steps||[]).join(" ")].join(" "));
  s._words = s._normName.split(" ").filter(w => w.length>1 && !STOPWORDS.has(w));
});

const messagesEl = document.getElementById('messages');
const form = document.getElementById('chatForm');
const input = document.getElementById('userInput');
const chipsEl = document.getElementById('chips');

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function addBotHTML(html){
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = html;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function typeBotHTML(html, speed){
  speed = speed || 30;
  const div = document.createElement('div');
  div.className = 'msg bot typing-cursor';
  messagesEl.appendChild(div);
  const tokens = html.match(/<[^>]+>|[\s\S]/gu) || [];
  const myToken = sendToken;
  let i = 0, out = '';
  const timer = setInterval(() => {
    if(!div.isConnected || myToken !== sendToken){ clearInterval(timer); return; }
    let tok;
    do { tok = tokens[i++]; out += tok; } while(i < tokens.length && tok.length > 1 && tok[0] === '<');
    div.innerHTML = out;
    messagesEl.scrollTop = messagesEl.scrollHeight;
    if(i >= tokens.length){
      clearInterval(timer);
      div.classList.remove('typing-cursor');
    }
  }, speed);
}
function addUser(text){
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function showTyping(){
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function hideTyping(){
  const t = document.getElementById('typingIndicator');
  if(t) t.remove();
}

function serviceListHTML(list, introLabel){
  let html = `<div class="tag">${escapeHtml(introLabel)}</div><div class="svc-list">`;
  list.forEach(s => {
    html += `<button type="button" class="svc-btn" data-svc="${s.id}">${escapeHtml(s.name)}</button>`;
  });
  html += `</div>`;
  return html;
}

function renderServiceDetail(s){
  let html = `<div class="tag">${escapeHtml(s.department)}</div><h3>${escapeHtml(s.name)}</h3>`;
  if(s.time_required){
    html += `<div class="field-label">⏱ الوقت اللازم للإنجاز</div><div>${escapeHtml(s.time_required)}</div>`;
  }
  if(s.documents && s.documents.length){
    html += `<div class="field-label">📄 الوثائق المطلوبة</div><ul>` + s.documents.map(d=>`<li>${escapeHtml(d)}</li>`).join("") + `</ul>`;
  }
  if(s.steps && s.steps.length){
    html += `<div class="field-label">🧭 خطوات إنجاز المعاملة</div><ul>` + s.steps.map(d=>`<li>${escapeHtml(d)}</li>`).join("") + `</ul>`;
  }
  if(s.legal_basis && s.legal_basis.length){
    html += `<div class="field-label">⚖️ السند القانوني</div><ul>` + s.legal_basis.map(d=>`<li>${escapeHtml(d)}</li>`).join("") + `</ul>`;
  }
  html += `<div class="note">المصدر: دليل خدمة الجمهور – بلدية سلفيت – الخدمة رقم ${s.id} (${escapeHtml(s.department)}). للتأكد من الرسوم والتفاصيل راجع مركز خدمة الجمهور.</div>`;
  return html;
}

let currentDept = null;

function showDepartment(dept){
  currentDept = dept;
  const list = SERVICES.filter(s => s.department === dept);
  addBotHTML(serviceListHTML(list, "اخترت قسم " + dept + " — اختر خدمة أو اكتب اسمها"));
}

function scoreService(queryWords, s){
  let score = 0;
  queryWords.forEach(w => {
    if(s._normName.includes(w)) score += 4;
    else if(s._normAll.includes(w)) score += 1;
  });
  return score;
}

function handleQuery(rawText){
  const norm = normalize(rawText);

  const deptHit = DEPARTMENTS.find(d => norm.includes(normalize(d)) || normalize(d).includes(norm));
  if(deptHit){
    showDepartment(deptHit);
    return;
  }

  if(!currentDept){
    addBotHTML("الرجاء اختيار القسم أولاً من الأزرار في الأعلى، بعدها اسأل عن الخدمة اللي بتحتاجها ضمن هذا القسم.");
    return;
  }

  const words = norm.split(" ").filter(w => w.length>1 && !STOPWORDS.has(w));
  if(words.length === 0){
    addBotHTML("يمكنك كتابة اسم الخدمة ضمن قسم " + currentDept + "، أو اختيار خدمة من القائمة أعلاه.");
    return;
  }

  const deptServices = SERVICES.filter(s => s.department === currentDept);
  const scored = deptServices.map(s => ({s, score: scoreService(words, s)}))
    .filter(x => x.score >= 3)
    .sort((a,b) => b.score - a.score);

  if(scored.length === 0){
    addBotHTML("لم أجد معلومات معتمدة حول هذا الموضوع ضمن قسم " + currentDept + " في دليل خدمة الجمهور لبلدية سلفيت، ولن أخمّن الإجابة. يمكنك التواصل مع مركز خدمة الجمهور، أو اختيار قسم آخر من الأزرار في الأعلى.");
    return;
  }

  if(scored.length === 1 || scored[0].score >= scored[1].score * 1.8){
    addBotHTML(renderServiceDetail(scored[0].s));
  } else {
    const top = scored.slice(0,6).map(x=>x.s);
    addBotHTML(serviceListHTML(top, "وجدت أكثر من خدمة قريبة من طلبك ضمن قسم " + currentDept + "، اختر منها"));
  }
}

let sendToken = 0;
function clearMessages(){
  sendToken++;
  messagesEl.innerHTML = '';
}

function handleUserText(text){
  if(!text.trim()) return;
  clearMessages();
  const myToken = sendToken;
  addUser(text);
  input.value = '';
  showTyping();
  setTimeout(() => {
    if(myToken !== sendToken) return;
    hideTyping();
    handleQuery(text);
  }, 450 + Math.random()*350);
}

form.addEventListener('submit', e => {
  e.preventDefault();
  handleUserText(input.value);
});

chipsEl.addEventListener('click', e => {
  const btn = e.target.closest('.chip');
  if(!btn) return;
  handleUserText(btn.dataset.q);
});

messagesEl.addEventListener('click', e => {
  const btn = e.target.closest('.svc-btn');
  if(!btn) return;
  const id = Number(btn.dataset.svc);
  const s = SERVICES.find(x => x.id === id);
  if(!s) return;
  clearMessages();
  const myToken = sendToken;
  addUser(s.name);
  showTyping();
  setTimeout(() => {
    if(myToken !== sendToken) return;
    hideTyping();
    addBotHTML(renderServiceDetail(s));
  }, 400);
});

DEPARTMENTS.forEach(d => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = d;
  b.dataset.q = d;
  chipsEl.appendChild(b);
});

typeBotHTML(
  "👋 أهلاً وسهلاً بك<br>" +
  "أنا <strong>GhatBot</strong>،<br>" +
  "المساعد الذكي لبلدية سلفيت.<br>" +
  "يمكنني مساعدتك في الاستفسار عن<br>" +
  "خدمات البلدية.<br>" +
  "⬆️ ابدأ باختيار القسم  من الأعلى"
);
